blueprint:
  name: Laundry Advisor
  description: >
    Recommends the **best place to dry laundry** – outside on the line, in one of
    up to five indoor rooms, in the tumble dryer – or tells you to wait until
    tomorrow to wash.


    Creates **one** sensor `sensor.<name>`: state = recommendation, everything
    else as attributes (outdoor score today/tomorrow/day-after, day preview, best
    time window, `rooms` = list of rooms sorted by drying suitability,
    `recommended_room`, `reason_codes` for the card).


    Bilingual via the `language` input (en/de) – affects `headline` and `reasons`
    (for notifications). The matching Lovelace card also localises on its own.


    Score: wind + vapour-pressure deficit (humidity/dew point) dominate, sun and
    temperature support; rain is a hard no. Rooms are scored by their
    vapour-pressure deficit, with a bonus for a dehumidifier / when airing helps
    (5-Kelvin dew-point rule) and a penalty above the RH limit; a mould guard
    trips above 80 % room humidity.


    Docs & sources: https://github.com/chlctt/ha-laundry-advisor
  domain: template
  source_url: https://github.com/chlctt/ha-laundry-advisor/blob/main/blueprints/template/laundry_advisor.yaml
  homeassistant:
    min_version: 2024.11.0
  input:
    sources:
      name: Data sources
      icon: mdi:weather-partly-cloudy
      input:
        weather_entity:
          name: Weather entity (primary)
          description: Provides the hourly and daily forecast.
          selector:
            entity:
              filter:
                - domain: weather
        precip_prob_entity:
          name: Second weather entity, precipitation probability only (optional)
          description: >
            Matched hour by hour. Leave empty if the primary source provides
            `precipitation_probability` itself (Germany's DWD does not, in hourly
            mode).
          default:
          selector:
            entity:
              filter:
                - domain: weather
        outdoor_temp:
          name: Outdoor temperature sensor (optional)
          description: Falls back to the temperature from the weather entity.
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        outdoor_humidity:
          name: Outdoor humidity sensor (optional)
          description: Falls back to the humidity from the weather entity.
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        already_washed_boolean:
          name: "Helper: laundry is already washed (optional)"
          description: >
            input_boolean. Switches `wait_for_tomorrow` (already washed → onto a
            rack) vs. `defer_wash` (not yet → postpone washing).
          default:
          selector:
            entity:
              filter:
                - domain: input_boolean

    output:
      name: Language & output
      icon: mdi:translate
      input:
        language:
          name: Text language
          description: Affects `headline` and `reasons`. The card also localises on its own.
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Deutsch
                  value: de
        dryer_entity:
          name: Tumble dryer (optional)
          description: >
            Any entity representing the dryer (smart plug, power sensor, door
            sensor). Used only as a presence flag: if set, "dryer" is a possible
            recommendation; if not, the least-bad room is recommended instead.
          default:
          selector:
            entity: {}

    room_1:
      name: Room 1 (drying room)
      icon: mdi:home-floor-1
      input:
        room_1_name:
          name: Name
          description: Free text, shown in the recommendation (e.g. "Basement").
          selector:
            text: {}
        room_1_temp:
          name: Temperature sensor
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_1_humidity:
          name: Humidity sensor
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        room_1_fan:
          name: Fan (optional)
          default:
          selector:
            entity:
              filter:
                - domain: fan
                - domain: switch
        room_1_dehumidifier:
          name: Dehumidifier (optional)
          default:
          selector:
            entity:
              filter:
                - domain: humidifier
                - domain: switch
                - domain: fan

    room_2:
      name: Room 2 (optional)
      icon: mdi:home-floor-2
      collapsed: true
      input:
        room_2_name:
          name: Name
          default: ""
          selector:
            text: {}
        room_2_temp:
          name: Temperature sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_2_humidity:
          name: Humidity sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        room_2_fan:
          name: Fan (optional)
          default:
          selector:
            entity:
              filter:
                - domain: fan
                - domain: switch
        room_2_dehumidifier:
          name: Dehumidifier (optional)
          default:
          selector:
            entity:
              filter:
                - domain: humidifier
                - domain: switch
                - domain: fan

    room_3:
      name: Room 3 (optional)
      icon: mdi:home-floor-3
      collapsed: true
      input:
        room_3_name:
          name: Name
          default: ""
          selector:
            text: {}
        room_3_temp:
          name: Temperature sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_3_humidity:
          name: Humidity sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        room_3_fan:
          name: Fan (optional)
          default:
          selector:
            entity:
              filter:
                - domain: fan
                - domain: switch
        room_3_dehumidifier:
          name: Dehumidifier (optional)
          default:
          selector:
            entity:
              filter:
                - domain: humidifier
                - domain: switch
                - domain: fan

    room_4:
      name: Room 4 (optional)
      icon: mdi:home-floor-a
      collapsed: true
      input:
        room_4_name:
          name: Name
          default: ""
          selector:
            text: {}
        room_4_temp:
          name: Temperature sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_4_humidity:
          name: Humidity sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        room_4_fan:
          name: Fan (optional)
          default:
          selector:
            entity:
              filter:
                - domain: fan
                - domain: switch
        room_4_dehumidifier:
          name: Dehumidifier (optional)
          default:
          selector:
            entity:
              filter:
                - domain: humidifier
                - domain: switch
                - domain: fan

    room_5:
      name: Room 5 (optional)
      icon: mdi:home-floor-b
      collapsed: true
      input:
        room_5_name:
          name: Name
          default: ""
          selector:
            text: {}
        room_5_temp:
          name: Temperature sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        room_5_humidity:
          name: Humidity sensor
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        room_5_fan:
          name: Fan (optional)
          default:
          selector:
            entity:
              filter:
                - domain: fan
                - domain: switch
        room_5_dehumidifier:
          name: Dehumidifier (optional)
          default:
          selector:
            entity:
              filter:
                - domain: humidifier
                - domain: switch
                - domain: fan

    tuning:
      name: Fine-tuning
      icon: mdi:cog
      collapsed: true
      input:
        block_hours:
          name: Length of the assessment window (h)
          default: 5
          selector:
            number: {min: 2, max: 10, unit_of_measurement: h}
        day_start_hour:
          name: Daylight start (hour, local)
          default: 8
          selector:
            number: {min: 3, max: 12}
        day_end_hour:
          name: Daylight end (hour, local)
          default: 20
          selector:
            number: {min: 14, max: 23}
        score_hang:
          name: Score threshold "hang outside"
          default: 70
          selector:
            number: {min: 40, max: 100}
        score_marginal:
          name: Score threshold "marginal"
          default: 45
          selector:
            number: {min: 20, max: 80}
        wait_delta:
          name: Score lead tomorrow needs over today to "wait"
          default: 20
          selector:
            number: {min: 5, max: 50}
        indoor_score_bias:
          name: Indoor penalty in the ranking
          description: >
            "Outside" wins at a similar score. Ranking only, not applied to the
            displayed room scores.
          default: 15
          selector:
            number: {min: 0, max: 40}
        weight_wind:
          name: Weight – wind
          default: 35
          selector:
            number: {min: 0, max: 100}
        weight_humidity:
          name: Weight – humidity / VPD
          default: 30
          selector:
            number: {min: 0, max: 100}
        weight_sun:
          name: Weight – sun
          default: 20
          selector:
            number: {min: 0, max: 100}
        weight_temperature:
          name: Weight – temperature
          default: 15
          selector:
            number: {min: 0, max: 100}
        room_rh_max:
          name: Max room RH for "usable" (%)
          default: 65
          selector:
            number: {min: 45, max: 80, unit_of_measurement: "%"}
        room_temp_min:
          name: Min room temperature for "usable" (°C)
          default: 15
          selector:
            number: {min: 8, max: 22, unit_of_measurement: "°C"}
        vent_dewpoint_margin:
          name: Dew-point margin for airing (K)
          default: 5
          selector:
            number: {min: 1, max: 9, unit_of_measurement: K}

variables:
  weather_entity: !input weather_entity
  prob_entity: !input precip_prob_entity
  in_outdoor_temp: !input outdoor_temp
  in_outdoor_humidity: !input outdoor_humidity
  in_washed: !input already_washed_boolean
  cfg_language: !input language
  in_dryer: !input dryer_entity
  rooms_cfg:
    - name: !input room_1_name
      temp: !input room_1_temp
      humidity: !input room_1_humidity
      fan: !input room_1_fan
      dehum: !input room_1_dehumidifier
    - name: !input room_2_name
      temp: !input room_2_temp
      humidity: !input room_2_humidity
      fan: !input room_2_fan
      dehum: !input room_2_dehumidifier
    - name: !input room_3_name
      temp: !input room_3_temp
      humidity: !input room_3_humidity
      fan: !input room_3_fan
      dehum: !input room_3_dehumidifier
    - name: !input room_4_name
      temp: !input room_4_temp
      humidity: !input room_4_humidity
      fan: !input room_4_fan
      dehum: !input room_4_dehumidifier
    - name: !input room_5_name
      temp: !input room_5_temp
      humidity: !input room_5_humidity
      fan: !input room_5_fan
      dehum: !input room_5_dehumidifier
  cfg_block_hours: !input block_hours
  cfg_day_start: !input day_start_hour
  cfg_day_end: !input day_end_hour
  cfg_hang: !input score_hang
  cfg_marginal: !input score_marginal
  cfg_wait_delta: !input wait_delta
  cfg_indoor_bias: !input indoor_score_bias
  cfg_w_wind: !input weight_wind
  cfg_w_hum: !input weight_humidity
  cfg_w_sun: !input weight_sun
  cfg_w_temp: !input weight_temperature
  cfg_rh_max: !input room_rh_max
  cfg_t_min: !input room_temp_min
  cfg_vent_margin: !input vent_dewpoint_margin

trigger:
  - platform: time_pattern
    minutes: "/15"
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
      - !input room_1_temp
      - !input room_1_humidity

action:
  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: hourly
    response_variable: fc_hourly
  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: daily
    response_variable: fc_daily
  - if:
      - condition: template
        value_template: "{{ prob_entity is not none and prob_entity | string | trim != '' }}"
    then:
      - action: weather.get_forecasts
        target:
          entity_id: !input precip_prob_entity
        data:
          type: hourly
        response_variable: fc_prob
    else:
      - variables:
          fc_prob: {}
  - variables:
      result: >
        {%- set we = weather_entity -%}
        {%- set hours = (fc_hourly.get(we, {}).get('forecast', [])) -%}
        {%- set pe = prob_entity -%}
        {%- set prob_hours = (fc_prob.get(pe, {}).get('forecast', []) if pe else []) -%}
        {%- set lang = cfg_language if cfg_language in ['de', 'en'] else 'de' -%}

        {# ================= macros ================= #}
        {%- macro dew_point(t, rh) -%}
          {%- set t = t | float(0) -%}{%- set rh = [rh | float(0), 0.5] | max -%}
          {%- set gm = (rh / 100) | log + (17.625 * t) / (243.04 + t) -%}
          {{- (243.04 * gm / (17.625 - gm)) | round(2) -}}
        {%- endmacro -%}
        {%- macro sat_vp(t) -%}
          {{- (6.1094 * e ** (17.625 * (t | float(0)) / (243.04 + (t | float(0))))) | round(4) -}}
        {%- endmacro -%}
        {%- macro abs_humidity(t, rh) -%}
          {%- set t = t | float(0) -%}{%- set rh = rh | float(0) -%}
          {%- set es = 6.1094 * e ** (17.625 * t / (243.04 + t)) -%}
          {{- (216.7 * (rh / 100 * es) / (t + 273.15)) | round(2) -}}
        {%- endmacro -%}
        {%- macro ramp(x, x0, x1) -%}
          {%- set x = x | float(0) -%}{{- [[(x - x0) / (x1 - x0), 0] | max, 1] | min -}}
        {%- endmacro -%}
        {%- macro hour_score(temp, rh, wind, gust, cloud, precip, pp, irr) -%}
          {%- if precip | float(0) > 0.1 -%}0
          {%- else -%}
            {%- set s_wind = [ramp(wind, 3, 12) | float, ramp(wind, 40, 25) | float] | min -%}
            {%- set td = dew_point(temp, rh) | float -%}
            {%- set spread = (temp | float(10)) - td -%}
            {%- set s_hum = [ramp(rh, 90, 55) | float, ramp(spread, 2, 6) | float] | min -%}
            {%- set s_sun = ramp(irr, 20, 450) | float if irr | float(-1) >= 0 else (1 - (cloud | float(50)) / 100) -%}
            {%- set s_temp = ramp(temp, 5, 20) | float -%}
            {%- set wsum = [cfg_w_wind + cfg_w_hum + cfg_w_sun + cfg_w_temp, 1] | max -%}
            {%- set base = (cfg_w_wind * s_wind + cfg_w_hum * s_hum + cfg_w_sun * s_sun + cfg_w_temp * s_temp) / wsum * 100 -%}
            {%- set m = 0.4 if pp | float(-1) > 60 else (0.7 if pp | float(-1) > 40 else 1.0) -%}
            {%- set sc = base * m -%}
            {%- set sc = [sc, 40] | min if gust | float(0) > 45 else sc -%}
            {{- [sc, 0] | max | round(1) -}}
          {%- endif -%}
        {%- endmacro -%}

        {# ============ index precipitation probability by hour ============ #}
        {%- set ns = namespace(prob={}) -%}
        {%- for p in prob_hours -%}
          {%- set ns.prob = dict(ns.prob, **{(as_timestamp(p.datetime) | int) | string: p.get('precipitation_probability')}) -%}
        {%- endfor -%}

        {# ============ score hours, group by date ============ #}
        {%- set g = namespace(days={}) -%}
        {%- for h in hours -%}
          {%- set ts = as_timestamp(h.datetime) -%}
          {%- set ldt = ts | timestamp_custom('%Y-%m-%d %H', true) -%}
          {%- set date = ldt[:10] -%}
          {%- set lhour = ldt[11:] | int -%}
          {%- set is_day = (lhour >= cfg_day_start and lhour < cfg_day_end) -%}
          {%- set pp = ns.prob.get((ts | int) | string, h.get('precipitation_probability')) -%}
          {%- set pp = -1 if pp is none else pp -%}
          {%- set sc = hour_score(h.get('temperature'), h.get('humidity'), h.get('wind_speed'),
                                  h.get('wind_gust_speed'), h.get('cloud_coverage'),
                                  h.get('precipitation'), pp, h.get('sun_irradiance')) | float -%}
          {%- set cur = g.days.get(date, []) -%}
          {%- set g.days = dict(g.days, **{date: cur + [{'hour': lhour, 'score': sc, 'is_day': is_day, 'ts': ts}]}) -%}
        {%- endfor -%}

        {%- macro best_block(entries) -%}
          {%- set day = entries | selectattr('is_day') | list | sort(attribute='hour') -%}
          {%- if day | length == 0 -%}0
          {%- else -%}
            {%- set win = [cfg_block_hours | int, day | length] | min -%}
            {%- set bb = namespace(v=0) -%}
            {%- for i in range(0, day | length - win + 1) -%}
              {%- set bb.v = [bb.v, (day[i:i + win] | map(attribute='score') | sum) / win] | max -%}
            {%- endfor -%}
            {%- set pen = 0.6 if (day | length) < ([cfg_block_hours | int, 4] | min) else 1.0 -%}
            {{- (bb.v * pen) | round(1) -}}
          {%- endif -%}
        {%- endmacro -%}

        {%- set today = now().strftime('%Y-%m-%d') -%}
        {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
        {%- set day_after = (now() + timedelta(days=2)).strftime('%Y-%m-%d') -%}
        {%- set today_score = best_block(g.days.get(today, [])) | float -%}
        {%- set tomorrow_score = best_block(g.days.get(tomorrow, [])) | float -%}
        {%- set day_after_score = best_block(g.days.get(day_after, [])) | float -%}
        {%- set nowts = as_timestamp(now()) -%}
        {%- set dl_left = g.days.get(today, []) | selectattr('is_day') | selectattr('ts', 'gt', nowts) | list | length -%}

        {# best window today #}
        {%- set tw = namespace(start=none, end=none, best=0) -%}
        {%- set tde = g.days.get(today, []) | selectattr('is_day') | list | sort(attribute='hour') -%}
        {%- if tde | length > 0 -%}
          {%- set win = [cfg_block_hours | int, tde | length] | min -%}
          {%- for i in range(0, tde | length - win + 1) -%}
            {%- set mean = (tde[i:i + win] | map(attribute='score') | sum) / win -%}
            {%- if mean > tw.best -%}
              {%- set tw.best = mean -%}{%- set tw.start = tde[i].hour -%}{%- set tw.end = tde[i + win - 1].hour + 1 -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {%- set fdays = namespace(l=[]) -%}
        {%- for d in (g.days.keys() | list | sort)[:6] -%}
          {%- set fdays.l = fdays.l + [{'date': d, 'score': best_block(g.days[d]) | float}] -%}
        {%- endfor -%}

        {# ================= outdoor air (live) for the dew-point comparison ================= #}
        {%- set o_t = (states(in_outdoor_temp) | float(none)) if in_outdoor_temp else state_attr(we, 'temperature') | float(none) -%}
        {%- set o_rh = (states(in_outdoor_humidity) | float(none)) if in_outdoor_humidity else state_attr(we, 'humidity') | float(none) -%}
        {%- set td_o = dew_point(o_t, o_rh) | float if (o_t is not none and o_rh is not none) else none -%}

        {# ================= score rooms ================= #}
        {%- set rns = namespace(l=[]) -%}
        {%- for rc in rooms_cfg -%}
          {%- set rname = (rc.name | default('')) | string | trim -%}
          {%- if rname != '' and rc.temp and rc.humidity -%}
            {%- set rt = states(rc.temp) | float(none) -%}
            {%- set rh = states(rc.humidity) | float(none) -%}
            {%- if rt is not none and rh is not none -%}
              {%- set td_r = dew_point(rt, rh) | float -%}
              {%- set ah_r = abs_humidity(rt, rh) | float -%}
              {%- set vpd_r = (sat_vp(rt) | float) * (1 - rh / 100) -%}
              {%- set vent = (td_o is not none and td_o <= td_r - cfg_vent_margin) -%}
              {%- set has_fan = (rc.fan is not none and rc.fan | string | trim != '') -%}
              {%- set has_deh = (rc.dehum is not none and rc.dehum | string | trim != '') -%}
              {%- set mold = rh > 80 -%}
              {%- set suitable = (rh < cfg_rh_max and rt >= cfg_t_min and not mold) -%}
              {%- set sc = ramp(vpd_r, 2, 12) | float * 100 -%}
              {%- set sc = sc + (10 if has_deh else 0) + (8 if vent else 0) + (5 if has_fan else 0) -%}
              {%- set sc = sc - (25 if rh >= cfg_rh_max else 0) -%}
              {%- set sc = 2 if mold else sc -%}
              {%- set sc = [[sc, 0] | max, 100] | min | round(1) -%}
              {%- set status = 'mold_risk' if mold else ('too_humid' if rh >= cfg_rh_max else ('too_cold' if rt < cfg_t_min else 'ok')) -%}
              {%- set rns.l = rns.l + [{
                    'name': rname, 'score': sc, 'status': status,
                    'temperature': rt | round(1), 'humidity': rh | round(1),
                    'dewpoint': td_r, 'abs_humidity': ah_r, 'vpd': vpd_r | round(1),
                    'ventilation_useful': vent, 'has_fan': has_fan, 'has_dehumidifier': has_deh,
                    'fan': (rc.fan if has_fan else none), 'dehumidifier': (rc.dehum if has_deh else none),
                    'suitable': suitable, 'mold_risk': mold, 'recommended': false }] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set rooms_sorted = rns.l | sort(attribute='score', reverse=true) | list -%}
        {%- set best_room = rooms_sorted[0] if rooms_sorted | length > 0 else none -%}
        {%- set any_suitable = rooms_sorted | selectattr('suitable') | list | length > 0 -%}
        {%- set all_mold = (rooms_sorted | length > 0) and (rooms_sorted | rejectattr('mold_risk') | list | length == 0) -%}
        {%- set has_dryer = (in_dryer is not none and in_dryer | string | trim != '') -%}
        {%- set washed = is_state(in_washed, 'on') if in_washed else false -%}

        {# ================= i18n ================= #}
        {%- set T = {
          'de': {
            'h': {
              'hang_outside_now': 'Raus damit – heute trocknet die Wäsche draußen gut.',
              'hang_outside_later': 'Heute noch möglich, aber das Fenster ist knapp.',
              'outside_marginal': 'Draußen geht, aber behalte den Himmel im Auge.',
              'wait_for_tomorrow': 'Heute auf den Ständer – morgen wird es draußen deutlich besser.',
              'defer_wash': 'Mit dem Waschen bis morgen warten lohnt sich.',
              'room_ventilate': 'Bester Ort: %s – Fenster stoßlüften und Ventilator an.',
              'room_dehumidify': 'Bester Ort: %s – mit Entfeuchter (Lüften bringt gerade nichts).',
              'dryer_recommended': 'Kein guter Trockenort – ab in den Wäschetrockner.',
              'best_effort': 'Kein wirklich guter Ort. Am ehesten: %s – dort gut lüften.',
              'mold_risk': 'Achtung: alle Räume zu feucht – nichts Nasses reinhängen.',
              'unknown': 'Noch keine Bewertung möglich.'
            },
            'r': {
              'outdoor_rain': 'Regen erwartet – draußen fällt aus.',
              'outdoor_good': 'Outdoor-Score heute {s}.',
              'outdoor_weak': 'Outdoor-Score heute nur {s}.',
              'tomorrow_better': 'Morgen deutlich besser ({t} statt {d}).',
              'room_best': '{n}: bester Innenraum (Score {s}).',
              'room_too_humid': '{n} bei {rh}% rF – über der Grenze.',
              'vent_useful': 'Außenluft ist trockener – Lüften hilft.',
              'vent_useless': 'Außenluft nicht trockener – Lüften bringt nichts.',
              'no_room': 'Kein Innenraum unter der Feuchtegrenze.',
              'no_dryer': 'Kein Wäschetrockner konfiguriert.',
              'mold': '{n}: Schimmelgefahr (rF über 80%).'
            }
          },
          'en': {
            'h': {
              'hang_outside_now': 'Hang it outside – good drying weather today.',
              'hang_outside_later': 'Still possible today, but the window is tight.',
              'outside_marginal': 'Outside works, but keep an eye on the sky.',
              'wait_for_tomorrow': 'Put it on a rack today – tomorrow is clearly better outside.',
              'defer_wash': 'Worth waiting until tomorrow to wash.',
              'room_ventilate': 'Best spot: %s – air it out and run a fan.',
              'room_dehumidify': 'Best spot: %s – with a dehumidifier (airing does nothing right now).',
              'dryer_recommended': 'No good drying spot – use the tumble dryer.',
              'best_effort': 'No really good spot. Best bet: %s – ventilate well there.',
              'mold_risk': 'Warning: every room is too humid – do not hang anything wet.',
              'unknown': 'No assessment possible yet.'
            },
            'r': {
              'outdoor_rain': 'Rain expected – outside is out.',
              'outdoor_good': 'Outdoor score today {s}.',
              'outdoor_weak': 'Outdoor score today only {s}.',
              'tomorrow_better': 'Tomorrow clearly better ({t} vs {d}).',
              'room_best': '{n}: best indoor room (score {s}).',
              'room_too_humid': '{n} at {rh}% RH – above the limit.',
              'vent_useful': 'Outdoor air is drier – airing helps.',
              'vent_useless': 'Outdoor air not drier – airing does nothing.',
              'no_room': 'No indoor room below the humidity limit.',
              'no_dryer': 'No tumble dryer configured.',
              'mold': '{n}: mould risk (RH above 80%).'
            }
          }
        } -%}
        {%- set L = T[lang] -%}

        {# ================= state machine ================= #}
        {%- set st = namespace(state='unknown', room=none, codes=[]) -%}
        {%- if all_mold -%}
          {%- set st.state = 'mold_risk' -%}
          {%- set st.codes = [{'code': 'mold', 'n': best_room.name}] -%}
        {%- elif today_score >= cfg_hang and dl_left >= 4 -%}
          {%- set st.state = 'hang_outside_now' -%}
          {%- set st.codes = [{'code': 'outdoor_good', 's': today_score | round}] -%}
        {%- elif today_score >= cfg_hang and dl_left < 4 -%}
          {%- set st.state = 'hang_outside_later' -%}
          {%- set st.codes = [{'code': 'outdoor_good', 's': today_score | round}] -%}
        {%- elif today_score >= 55 and dl_left >= 3 -%}
          {%- set st.state = 'outside_marginal' -%}
          {%- set st.codes = [{'code': 'outdoor_good', 's': today_score | round}] -%}
        {%- elif tomorrow_score >= cfg_hang and (tomorrow_score - today_score) >= cfg_wait_delta and not any_suitable -%}
          {%- set st.state = 'wait_for_tomorrow' if washed else 'defer_wash' -%}
          {%- set st.codes = [{'code': 'tomorrow_better', 't': tomorrow_score | round, 'd': today_score | round}, {'code': 'no_room'}] -%}
        {%- elif any_suitable -%}
          {%- set cand = (rooms_sorted | selectattr('suitable') | list)[0] -%}
          {%- set st.room = cand.name -%}
          {%- if cand.ventilation_useful or not cand.has_dehumidifier -%}
            {%- set st.state = 'room_ventilate' -%}
            {%- set st.codes = [{'code': 'room_best', 'n': cand.name, 's': cand.score | round},
                                {'code': ('vent_useful' if cand.ventilation_useful else 'vent_useless')}] -%}
          {%- else -%}
            {%- set st.state = 'room_dehumidify' -%}
            {%- set st.codes = [{'code': 'room_best', 'n': cand.name, 's': cand.score | round}, {'code': 'vent_useless'}] -%}
          {%- endif -%}
        {%- elif has_dryer -%}
          {%- set st.state = 'dryer_recommended' -%}
          {%- set st.codes = [{'code': 'no_room'}, {'code': 'outdoor_weak', 's': today_score | round}] -%}
        {%- elif best_room is not none -%}
          {%- set st.state = 'best_effort' -%}
          {%- set st.room = best_room.name -%}
          {%- set st.codes = [{'code': 'no_room'}, {'code': 'no_dryer'}, {'code': 'room_best', 'n': best_room.name, 's': best_room.score | round}] -%}
        {%- else -%}
          {%- set st.state = 'dryer_recommended' if has_dryer else 'unknown' -%}
        {%- endif -%}

        {# mark the recommended room #}
        {%- set rooms_out = namespace(l=[]) -%}
        {%- for r in rooms_sorted -%}
          {%- set rr = dict(r, **{'recommended': (r.name == st.room)}) -%}
          {%- set rooms_out.l = rooms_out.l + [rr] -%}
        {%- endfor -%}

        {# localised headline + reasons #}
        {%- set hl = L.h.get(st.state, '') -%}
        {%- set hl = hl % st.room if ('%s' in hl and st.room) else (hl | replace(' %s', '') | replace('%s', '')) -%}
        {%- set rs = namespace(l=[]) -%}
        {%- for c in st.codes -%}
          {%- set tmpl = L.r.get(c.code, c.code) -%}
          {%- set rs.l = rs.l + [tmpl.format(s=c.get('s',''), t=c.get('t',''), d=c.get('d',''), n=c.get('n',''), rh=c.get('rh',''))] -%}
        {%- endfor -%}
        {%- set rec_room_obj = (rooms_out.l | selectattr('recommended') | list) -%}
        {%- set rec_room_obj = rec_room_obj[0] if rec_room_obj | length > 0 else none -%}

        {{
          {
            'state': st.state,
            'language': lang,
            'headline': hl,
            'reasons': rs.l,
            'reason_codes': st.codes,
            'recommended_room': st.room,
            'recommended_fan': (rec_room_obj.fan if rec_room_obj else none),
            'recommended_dehumidifier': (rec_room_obj.dehumidifier if rec_room_obj else none),
            'today': today_score,
            'tomorrow': tomorrow_score,
            'day_after': day_after_score,
            'daylight_left_h': dl_left,
            'window_start_hour': tw.start,
            'window_end_hour': tw.end,
            'forecast_days': fdays.l,
            'rooms': rooms_out.l
          }
        }}

sensor:
  - name: Laundry Advisor
    unique_id: laundry_advisor_recommendation
    state: "{{ result.state }}"
    icon: >
      {% set m = {'hang_outside_now': 'mdi:weather-sunny', 'hang_outside_later': 'mdi:weather-sunset',
                  'outside_marginal': 'mdi:weather-partly-cloudy', 'wait_for_tomorrow': 'mdi:timer-sand',
                  'defer_wash': 'mdi:washing-machine-off', 'room_ventilate': 'mdi:window-open-variant',
                  'room_dehumidify': 'mdi:air-humidifier', 'dryer_recommended': 'mdi:tumble-dryer',
                  'best_effort': 'mdi:home-alert', 'mold_risk': 'mdi:alert'} %}
      {{ m.get(result.state, 'mdi:tshirt-crew') }}
    attributes:
      language: "{{ result.language }}"
      headline: "{{ result.headline }}"
      reasons: "{{ result.reasons }}"
      reason_codes: "{{ result.reason_codes }}"
      recommended_room: "{{ result.recommended_room }}"
      recommended_fan: "{{ result.recommended_fan }}"
      recommended_dehumidifier: "{{ result.recommended_dehumidifier }}"
      outdoor_score: "{{ result.today }}"
      outdoor_score_tomorrow: "{{ result.tomorrow }}"
      outdoor_score_day_after: "{{ result.day_after }}"
      daylight_left_h: "{{ result.daylight_left_h }}"
      best_window_start_hour: "{{ result.window_start_hour }}"
      best_window_end_hour: "{{ result.window_end_hour }}"
      forecast_days: "{{ result.forecast_days }}"
      rooms: "{{ result.rooms }}"
