# Example automation: notification + optional actuator control in the recommended room.
# Copy into automations.yaml and adjust the notify target.

- id: laundry_advisor_notify
  alias: "Laundry: recommendation changed"
  description: >
    Notifies on a state change of the laundry advisor sensor. Optionally switches
    the fan and dehumidifier of the recommended room (from the attributes
    recommended_fan / recommended_dehumidifier).
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.laundry_advisor
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state.state not in ['unknown', 'unavailable', none]
           and trigger.to_state.state not in ['unknown', 'unavailable'] }}
    - condition: time
      after: "07:00:00"
      before: "21:30:00"
  action:
    - variables:
        adv: sensor.laundry_advisor
        state: "{{ trigger.to_state.state }}"
        room: "{{ state_attr(adv, 'recommended_room') }}"
        fan: "{{ state_attr(adv, 'recommended_fan') }}"
        deh: "{{ state_attr(adv, 'recommended_dehumidifier') }}"
        window_start: "{{ state_attr(adv, 'best_window_start_hour') }}"
        window_end: "{{ state_attr(adv, 'best_window_end_hour') }}"
    - action: notify.family_phones
      data:
        title: "Laundry Advisor"
        message: >
          {{ state_attr(adv, 'headline') }}
          {% if window_start is not none and state.startswith('hang_outside') %}
          Best window: {{ window_start }}–{{ window_end }}.
          {% endif %}

    # --- actuators in the recommended room ---
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ state in ['room_ventilate', 'room_dehumidify', 'best_effort'] }}"
          sequence:
            - if:
                - "{{ fan not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ fan }}"
            - if:
                - "{{ state == 'room_dehumidify' and deh not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ deh }}"
        # outside recommended -> turn the indoor actuators back off
        - conditions:
            - condition: template
              value_template: "{{ state.startswith('hang_outside') }}"
          sequence:
            - if:
                - "{{ fan not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_off
                  target:
                    entity_id: "{{ fan }}"
            - if:
                - "{{ deh not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_off
                  target:
                    entity_id: "{{ deh }}"
