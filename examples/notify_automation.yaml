# Beispiel-Automation: Benachrichtigung + optionale Aktorsteuerung im empfohlenen Raum.
# Kopieren nach automations.yaml und notify-Ziel anpassen.

- id: laundry_advisor_notify
  alias: "Wäsche: Empfehlung geändert"
  description: >
    Meldet Zustandswechsel des Laundry-Advisor-Sensors. Schaltet optional
    Ventilator und Entfeuchter des empfohlenen Raums (aus den Attributen
    recommended_fan / recommended_dehumidifier).
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.laundry_advisor
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state.state not in ['unknown', 'unavailable', none]
           and trigger.to_state.state not in ['unknown', 'unavailable'] }}
    - condition: time
      after: "07:00:00"
      before: "21:30:00"
  action:
    - variables:
        adv: sensor.laundry_advisor
        state: "{{ trigger.to_state.state }}"
        room: "{{ state_attr(adv, 'recommended_room') }}"
        fan: "{{ state_attr(adv, 'recommended_fan') }}"
        deh: "{{ state_attr(adv, 'recommended_dehumidifier') }}"
        window_start: "{{ state_attr(adv, 'best_window_start_hour') }}"
        window_end: "{{ state_attr(adv, 'best_window_end_hour') }}"
    - action: notify.family_phones
      data:
        title: "Wäschewetter"
        message: >
          {{ state_attr(adv, 'headline') }}
          {% if window_start is not none and state.startswith('hang_outside') %}
          Bestes Fenster: {{ window_start }}–{{ window_end }} Uhr.
          {% endif %}

    # --- Aktoren im empfohlenen Raum ---
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ state in ['room_ventilate', 'room_dehumidify', 'best_effort'] }}"
          sequence:
            - if:
                - "{{ fan not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ fan }}"
            - if:
                - "{{ state == 'room_dehumidify' and deh not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ deh }}"
        # draußen empfohlen -> Innenraum-Aktoren wieder aus
        - conditions:
            - condition: template
              value_template: "{{ state.startswith('hang_outside') }}"
          sequence:
            - if:
                - "{{ fan not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_off
                  target:
                    entity_id: "{{ fan }}"
            - if:
                - "{{ deh not in [none, 'None', ''] }}"
              then:
                - action: homeassistant.turn_off
                  target:
                    entity_id: "{{ deh }}"
