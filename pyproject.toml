[project]
name = "ha-laundry-advisor"
version = "0.3.0"
description = "Home Assistant integration + template blueprint that recommends the best place to dry laundry"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# RUF001-003: the en dash in user-facing strings is deliberate typography.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
