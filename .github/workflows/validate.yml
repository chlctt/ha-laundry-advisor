name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d relaxed blueprints/ examples/
      - name: Parse blueprint & examples (HA YAML tags aware)
        run: |
          python - <<'PY'
          import glob
          import yaml

          class HALoader(yaml.SafeLoader):
              pass

          def _passthrough(loader, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              return loader.construct_mapping(node)

          for tag in ("!input", "!secret", "!include", "!include_dir_list",
                      "!include_dir_named", "!include_dir_merge_list",
                      "!include_dir_merge_named", "!env_var"):
              HALoader.add_constructor(tag, _passthrough)

          for f in glob.glob("blueprints/**/*.yaml", recursive=True) + \
                   glob.glob("examples/**/*.yaml", recursive=True):
              with open(f, encoding="utf-8") as fh:
                  yaml.load(fh, Loader=HALoader)
              print("ok:", f)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/

  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - name: pure logic (no Home Assistant)
        run: pytest tests/test_drying.py -q

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest tests/integration/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # The HACS default-store check (hacs/action, category: integration) is not run
  # here – it requires brand assets + a listing PR to hacs/default that only
  # matter for default-store inclusion, not custom-repo installs. Add it back
  # when submitting to the default store.
