name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d relaxed examples/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/

  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - name: pure logic (no Home Assistant)
        run: pytest tests/test_drying.py -q

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - name: HA test harness must be >= the hacs.json floor
        run: |
          python - <<'PY'
          import json
          from awesomeversion import AwesomeVersion
          from homeassistant.const import __version__ as ha

          floor = json.load(open("hacs.json"))["homeassistant"]
          assert AwesomeVersion(ha) >= AwesomeVersion(floor), f"HA {ha} < floor {floor}"
          print(f"HA {ha} >= floor {floor}")
          PY
      - run: pytest tests/integration/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # The HACS default-store check (hacs/action, category: integration) is not run
  # here – it requires brand assets + a listing PR to hacs/default that only
  # matter for default-store inclusion, not custom-repo installs. Add it back
  # when submitting to the default store.
